<!doctype html>
<html><head><meta charset="utf-8"><title>Odi outro</title>
<style>
  :root { --lime: #c5f467; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: radial-gradient(60% 55% at 50% 42%, rgba(197,244,103,.10), transparent 70%), #0b0b0b; color: #f4f4f4;
         font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .stage { position: absolute; inset: 0; display: grid; place-items: center; }
  .row { display: flex; align-items: center; gap: 56px; margin-top: -120px; }
  .odi { width: 400px; height: 400px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(197,244,103,.45), 0 30px 80px rgba(0,0,0,.6), 0 0 120px rgba(197,244,103,.18);
         animation: pop .9s cubic-bezier(.2,1.6,.4,1) both; }
  .odi svg { width: 100%; height: 100%; display: block; }
  .body { animation: bob 2.4s ease-in-out .9s infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .eyes { animation: blink 3.2s 1.8s infinite; transform-box: fill-box; transform-origin: center; }
  .pupils { animation: look 5.5s ease-in-out .9s both; }
  .led { animation: led 1.1s ease-in-out infinite; }
  .bubble { position: relative; width: 640px; padding: 34px 40px; border-radius: 34px; background: #1a1a1a; border: 3px solid var(--lime);
            font-size: 40px; line-height: 1.35; box-shadow: 0 20px 60px rgba(0,0,0,.5); opacity: 0; animation: in .45s ease-out 1.1s forwards; }
  .bubble::before { content: ""; position: absolute; left: -19px; top: 50%; width: 30px; height: 30px; background: #1a1a1a;
                    border-left: 3px solid var(--lime); border-bottom: 3px solid var(--lime); transform: translateY(-50%) rotate(45deg); }
  .bubble b { color: var(--lime); }
  .caret { display: inline-block; width: 3px; height: 1em; background: var(--lime); vertical-align: -0.12em; margin-left: 4px; animation: caret .8s steps(1) infinite; }
  .brand { position: absolute; left: 0; right: 0; bottom: 150px; text-align: center; opacity: 0; animation: in .6s ease-out 3.4s forwards; }
  .logo { display: inline-flex; align-items: center; gap: 18px; font-size: 54px; font-weight: 700; letter-spacing: .04em; }
  .logo span.mark { display: grid; place-items: center; width: 76px; height: 76px; border-radius: 50%; background: var(--lime); color: #07090e; }
  .tag { margin-top: 14px; font-size: 30px; color: #c4c4c4; }
  .links { margin-top: 26px; display: flex; justify-content: center; gap: 22px; font-size: 26px; }
  .links span { padding: 10px 22px; border-radius: 999px; background: #1f1f1f; border: 1px solid #333; color: #e6e6e6; }
  .links span.hl { border-color: var(--lime); color: var(--lime); }
  @keyframes pop { from { transform: scale(.4) translateY(80px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-3px) rotate(2deg); } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes look { 0% { transform: translate(0,0); } 18% { transform: translate(-4px,-1px); } 40% { transform: translate(4px,-1px); } 60%, 100% { transform: translate(0,0); } }
  @keyframes led { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes caret { 50% { opacity: 0; } }
</style></head>
<body><div class="stage">
  <div class="row">
    <div class="odi">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <radialGradient id="dome" cx="35%" cy="25%" r="80%"><stop offset="0" stop-color="#e6ffb0"/><stop offset=".45" stop-color="#c5f467"/><stop offset="1" stop-color="#6f9a24"/></radialGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <clipPath id="clip"><circle cx="50" cy="50" r="50"/></clipPath>
        </defs>
        <g clip-path="url(#clip)">
          <circle cx="50" cy="50" r="50" fill="#1b2116"/>
          <g class="body">
            <line x1="50" y1="16" x2="50" y2="34" stroke="#a9d84e" stroke-width="4" stroke-linecap="round"/>
            <circle class="led" cx="50" cy="14" r="5" fill="url(#dome)"/>
            <rect x="42" y="32" width="16" height="6" rx="3" fill="#a9d84e"/>
            <path d="M4 104C4 64 24 37 50 37s46 27 46 67Z" fill="url(#dome)"/>
            <path d="M22 56a32 32 0 0 1 16-12" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M17 104C17 76 31 60 50 60s33 16 33 44Z" fill="#0a0d07"/>
            <g class="eyes"><g class="pupils" fill="#eaffc4" filter="url(#glow)">
              <ellipse cx="38" cy="79" rx="7.5" ry="8.5"/><ellipse cx="62" cy="79" rx="7.5" ry="8.5"/>
            </g></g>
          </g>
        </g>
      </svg>
    </div>
    <div class="bubble"><span id="say"></span><span class="caret"></span></div>
  </div>
  <div class="brand">
    <div class="logo"><span class="mark"><svg viewBox="0 0 24 24" width="42" height="42" fill="currentColor"><g transform="translate(0.2 -1.2)"><path d="M4 16.4C5.4 19.2 8.2 20.6 12 20.6s6.6-1.4 8-4.2H4Z"/><rect x="11.15" y="3.6" width="1.7" height="12.4" rx="0.4"/><path d="M13.2 4.2 19.4 14.2H13.2V4.2Z"/><path d="M10.8 7.4 6.2 14.2h4.6V7.4Z"/></g></svg></span>ODYSSEY</div>
    <div class="tag">Real-world data for AI, signed at the sensor, owned by the people who capture it.</div>
    <div class="links"><span class="hl">odyssey-blush-seven.vercel.app</span><span>github.com/AnaSyLabs/Odyssey</span><span>ETHGlobal Mumbai 2026</span></div>
  </div>
</div>
<script>
  // Odi types its line, like a game guide
  const text = "Thanks for watching! I'm <b>Odi</b>. Come explore Odyssey with me.";
  const plain = text.replace(/<[^>]+>/g, "");
  const el = document.getElementById("say");
  let i = 0;
  setTimeout(function tick() {
    i++;
    // rebuild with the bold name kept intact
    let shown = plain.slice(0, i);
    el.innerHTML = shown.replace("Odi", "<b>Odi</b>");
    if (i < plain.length) setTimeout(tick, 38);
  }, 1500);
</script>
</body></html>
